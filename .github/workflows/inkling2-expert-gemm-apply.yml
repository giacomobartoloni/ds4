name: Apply Inkling2 expert GEMM source patch
on:
  push:
    branches:
      - perf/inkling2-expert-bucketed-iq4-gemm-m4
permissions:
  contents: write
jobs:
  apply-and-commit:
    if: github.event.head_commit.message == 'chore(inkling): stage expert GEMM source application'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Reconstruct verified patcher and apply source modifications
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, zlib
          root=pathlib.Path('tools/inkling32_parts')
          parts=sorted(root.glob('part_*'))
          assert len(parts)==7, f'expected 7 parts, got {len(parts)}'
          encoded=''.join(p.read_text() for p in parts)
          assert len(encoded)==9864, f'bad encoded length {len(encoded)}'
          data=zlib.decompress(base64.b64decode(encoded,validate=True))
          expected='75364d190966507c51f3a3187531b244ea62fdf8d6c6d5ef7e97a597c3dceb95'
          assert hashlib.sha256(data).hexdigest()==expected, 'patcher integrity mismatch'
          pathlib.Path('tools/apply_inkling2_expert_gemm.py').write_bytes(data)
          PY
          python3 -m py_compile tools/apply_inkling2_expert_gemm.py
          python3 tools/apply_inkling2_expert_gemm.py --check
          python3 tools/apply_inkling2_expert_gemm.py --apply
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" -eq 9
          rm -rf tools/inkling32_parts
          rm -f .github/workflows/inkling2-expert-gemm-apply.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(inkling2): add experimental expert-bucketed IQ4_NL Metal path'
          git push origin HEAD:perf/inkling2-expert-bucketed-iq4-gemm-m4
