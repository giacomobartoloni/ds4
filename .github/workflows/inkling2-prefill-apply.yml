name: Apply Inkling prefill patch (one shot)
on:
  push:
    branches:
      - perf/inkling2-prefill-defer-logits-profile-m4
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack pinned patcher
        shell: bash
        run: |
          mkdir -p tools
          python3 - <<'PY'
          from pathlib import Path
          import zlib
          packed = Path("tools/inkling2_prefill_patch.py.zlib").read_bytes()
          Path("tools/apply_inkling2_prefill_optimization.py").write_bytes(zlib.decompress(packed))
          PY
      - name: Apply source, test, and documentation edits
        shell: bash
        run: |
          python3 -m py_compile tools/apply_inkling2_prefill_optimization.py
          python3 tools/apply_inkling2_prefill_optimization.py . --check
          python3 tools/apply_inkling2_prefill_optimization.py . --apply
          git diff --check
          git diff --stat
      - name: Commit actual modified C source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- tools/inkling2_prefill_patch.py.zlib .github/workflows/inkling2-prefill-apply.yml
          git add -- tools/apply_inkling2_prefill_optimization.py ds4.c tests/test_inkling2_session.c docs/INKLING2_METAL.md
          git commit -m "perf(inkling2): defer intermediate prefill logits and add A/B profiling [prefill-applied]"
          git push origin HEAD:refs/heads/perf/inkling2-prefill-defer-logits-profile-m4
